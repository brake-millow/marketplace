
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brake MC</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px;
      font-family: Arial, sans-serif;
      background: #f6f8f4;
      color: #263b2b;
      text-align: center;
    }

    h1 {
      color: #39734a;
      font-size: 36px;
      margin-bottom: 12px;
    }

    p {
      line-height: 1.7;
      color: #617064;
    }

    h2 {
      margin-top: 36px;
      color: #39734a;
    }
    
<input
  type="search"
  id="searchInput"
  placeholder="🔎 Search resources..."
  aria-label="Search resources"
/>

    ul {
      list-style: none;
      padding: 0;
      max-width: 420px;
      margin: 20px auto;
    }

    li {
      background: white;
      border: 1px solid #e1e9df;
      border-radius: 14px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: 0 3px 10px #263b2b0a;
    }

    li:hover {
      background: #eaf3e8;
    }
    
#searchInput {
  display: block;
  width: 100%;
  max-width: 420px;
  margin: 20px auto;
  padding: 14px 18px;
  border: 1px solid #d5e3d3;
  border-radius: 14px;
  background: white;
  color: #263b2b;
  font-size: 16px;
  outline: none;
}

#searchInput:focus {
  border-color: #39734a;
  box-shadow: 0 0 0 3px #39734a18;
}

  </style>
</head>
<body>
  <h1>🌸 Brake MC</h1>

  <p>Welcome to Brake MC!</p>
  <p>Share Resourcepacks, Add-on and Maps free!!</p>

  <h2>Explore the Library</h2>

  <ul>
    <li>Resourcepacks</li>
    <li>Add-ons</li>
    <li>Maps</li>
  </ul>

  <p>Made with 💚 by Brake.</p>
  
  <script>
    const searchInput = document.getElementById("searchInput");
    const items = document.querySelectorAll("ul li");

    searchInput.addEventListener("input", function () {
      const searchText = searchInput.value.toLowerCase();

      items.forEach(function (item) {
        const itemText = item.textContent.toLowerCase();

        if (itemText.includes(searchText)) {
          item.style.display = "";
        } else {
          item.style.display = "none";
        }
      });
    });
  </script>

</body>
</html>
